name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome CI
        run: pnpm ci:check

      - name: Run TypeScript check
        run: pnpm type-check

      - name: Check deprecated APIs
        run: pnpm check:deprecated

      - name: Validate Lean V2 migrations
        run: pnpm check:lean-v2

      - name: Run tests
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Install browser smoke tooling
        run: |
          npm install --prefix /tmp/kisok-browser-tools --no-package-lock --no-save playwright@1.61.0
          node /tmp/kisok-browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run PWA browser smoke
        run: node scripts/pwa-browser-check.mjs

      - name: Show safe formatting fixes after a failed check
        if: ${{ failure() }}
        run: |
          pnpm exec biome check --write src/features/admin-pwa scripts/lib/deprecation.ts scripts/lib/deprecation.test.ts scripts/check-deprecated.ts scripts/pwa-browser-check.mjs test/order-push-handler.test.ts test/service-worker.test.ts || true
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const paths = execFileSync('git', ['diff', '--name-only', '-z']).toString().split('\0').filter(Boolean);
          for (const path of paths) {
            console.log('PWA_FORMATTED_FILE ' + JSON.stringify({ path, content: readFileSync(path, 'utf8') }));
          }
          NODE

  database-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Start isolated local Supabase
        run: pnpm supabase start
      - name: Run local pgTAP tests
        run: pnpm supabase test db
      - name: Stop local Supabase
        if: ${{ always() }}
        run: pnpm supabase stop --no-backup

  edge-type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check push Edge Function
        run: deno check --config supabase/functions/order-push/deno.json supabase/functions/order-push/index.ts
