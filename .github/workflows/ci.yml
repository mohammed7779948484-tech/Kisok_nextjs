name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome CI
        run: pnpm ci:check

      - name: Run TypeScript check
        run: pnpm type-check

      - name: Check deprecated APIs
        run: pnpm check:deprecated

      - name: Validate Lean V2 migrations
        run: pnpm check:lean-v2

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build
